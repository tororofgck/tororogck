<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>プリンワールド 第1話</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  background:#111;
  color:#fff;
  font-family:Arial,"Noto Sans JP",sans-serif;
}

.header{
  position:sticky;
  top:0;
  z-index:10;
  background:#111;
  border-bottom:1px solid #333;
  padding:14px 18px;
}

.title{
  font-size:24px;
  font-weight:800;
}

.episode{
  margin-top:4px;
  color:#999;
  font-size:13px;
}

.manga{
  width:100%;
  max-width:1000px;
  margin:0 auto;
  background:#fff;
}

.page{
  display:block;
  width:100%;
  height:auto;
}

@media(max-width:600px){

  .header{
    padding:10px 12px;
  }

  .title{
    font-size:20px;
  }

  .episode{
    font-size:11px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="title">
    プリンワールド
  </div>

  <div class="episode">
    第一話「プリンを食べて寝たら、異世界に召喚された」
  </div>
</header>

<main class="manga">

  <img
    class="page"
    src="pudding_episode01.png"
    alt="プリンワールド 第一話">

</main>

</body>
</html>
