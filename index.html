<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>プリンワールド｜漫画とYouTube</title><style>
*{box-sizing:border-box}body{margin:0;background:#111;color:white;font-family:system-ui,sans-serif}header{text-align:center;padding:12px;font-weight:800;background:#202027}.layout{max-width:1300px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;padding:12px}.main{min-width:0}.dock{position:sticky;top:0;z-index:5;background:#111;padding-bottom:8px}.player-box{aspect-ratio:16/9;background:black;border-radius:9px;overflow:hidden}#player,#player iframe{width:100%!important;height:100%!important;border:0}.video-info{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 2px;font-size:12px}.video-info span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.video-info button,.close{background:#333;color:white;border:1px solid #555;border-radius:6px;padding:7px;white-space:nowrap}.manga{margin-top:14px;background:white;color:#111;border-radius:9px;overflow:hidden}.manga h1{margin:0;padding:14px;background:#24242a;color:white;font-size:23px}.round{background:#24242a;padding:10px}.round select{width:100%;background:#333;color:white;border:1px solid #777;border-radius:6px;padding:10px}.episode{background:#222;color:white;padding:13px;font-size:14px;font-weight:bold}.manga img{display:block;width:100%;height:auto}.missing{padding:30px;text-align:center;color:#555}.side h2{font-size:17px;margin:8px 0}.list{display:grid;gap:8px}.item{display:grid;grid-template-columns:115px 1fr;gap:8px;background:#222;color:white;border:1px solid #333;border-radius:8px;padding:5px;text-align:left;cursor:pointer}.item.active{border-color:#e6b453}.item img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:5px}.item span{font-size:12px;line-height:1.35}.shorts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.short{padding:0;background:#222;color:white;border:1px solid #444;border-radius:6px;overflow:hidden;text-align:left;cursor:pointer}.short img{display:block;width:100%;aspect-ratio:9/16;object-fit:cover}.short span{display:block;font-size:10px;padding:5px}.modal{display:none;position:fixed;inset:0;background:#000e;z-index:30;align-items:center;justify-content:center;flex-direction:column;gap:10px}.modal.open{display:flex}.short-frame{width:min(90vw,390px);height:min(77vh,690px)}.short-frame iframe{width:100%;height:100%;border:0}@media(max-width:760px){header{font-size:14px;padding:9px}.layout{display:block;padding:0 7px}.dock{padding-top:5px}.manga{margin-top:7px}.manga h1{font-size:19px;padding:10px}.episode{font-size:12px}.side{padding:12px 0}.list{display:flex;overflow-x:auto}.item{flex:0 0 150px;display:block}.item img{width:100%}.item span{display:block;margin-top:4px;font-size:11px}.shorts{grid-template-columns:repeat(4,1fr)}.side h2{font-size:15px}}
</style></head><body><header>📺 神宮寺匁トロロ × 📖 プリンワールド</header><div class="layout"><main class="main"><div class="dock"><div class="player-box"><div id="player"></div></div><div class="video-info"><span id="currentTitle">動画を読み込み中…</span><button id="sound">🔇 音を出す</button></div></div><section class="manga"><h1>📖 プリンワールド</h1><div class="round"><select id="roundSelect" aria-label="周目を選択"></select></div><div id="pages"></div></section></main><aside class="side"><h2>📺 おすすめ通常動画</h2><div id="list" class="list">読み込み中…</div><h2>📱 Shorts</h2><div id="shorts" class="shorts">読み込み中…</div></aside></div><div class="modal" id="modal"><button class="close" id="close">✕ 閉じる</button><div class="short-frame" id="shortFrame"></div></div><script>
const titles={1:'第一話「プリンを食べて寝たら、異世界に召喚された」',2:'第二話「プリンの女神とヨーグルトの女神～なぜか国同士が喧嘩してました～」',3:'第三話「異世界の勇者に選ばれた俺、プリン博士の研究所へ行くことになりました」',4:'第四話「召喚した猫、まさかの伝説級！？〜あくびで研究所が吹き飛んだ〜」'};const round=document.getElementById('roundSelect');for(let i=1;i<=20;i++){let o=document.createElement('option');o.value=i;o.textContent=i+'周目';round.append(o)}function manga(n){const root=document.getElementById('pages');root.replaceChildren();for(let i=(n-1)*4+1;i<=n*4;i++){let t=document.createElement('div');t.className='episode';t.textContent=titles[i]||'第'+i+'話';let img=document.createElement('img');img.src='pudding_episode'+String(i).padStart(2,'0')+'.png';img.alt=t.textContent;img.loading=i===1?'eager':'lazy';img.onerror=()=>{let d=document.createElement('div');d.className='missing';d.textContent='第'+i+'話の画像は未登録です';img.replaceWith(d)};root.append(t,img)}}round.onchange=()=>manga(+round.value);manga(1);
let normal=[],shorts=[],player,ready=false,index=0,unmuted=false;const id=v=>v.videoId||v.contentDetails?.videoId||v.id||'';const title=v=>v.title||v.snippet?.title||'動画';const thumb=v=>v.thumbnail||v.snippet?.thumbnails?.medium?.url||'https://i.ytimg.com/vi/'+id(v)+'/mqdefault.jpg';function choose(i){index=(i+normal.length)%normal.length;document.getElementById('currentTitle').textContent=title(normal[index]);document.querySelectorAll('.item').forEach((e,j)=>e.classList.toggle('active',j===index))}function play(i){if(!normal.length)return;choose(i);if(ready){player.loadVideoById(id(normal[index]));if(!unmuted)player.mute();player.playVideo()}}function onYouTubeIframeAPIReady(){if(!normal.length)return;player=new YT.Player('player',{videoId:id(normal[0]),playerVars:{autoplay:1,mute:1,playsinline:1,controls:1,origin:location.origin},events:{onReady:e=>{ready=true;e.target.mute();e.target.playVideo()},onStateChange:e=>{if(e.data===YT.PlayerState.ENDED)play(index+1)}}})}function render(rootId,data,isShort){const root=document.getElementById(rootId);root.replaceChildren();if(!data.length){root.textContent='動画がありません';return}data.forEach((v,i)=>{let b=document.createElement('button');b.className=isShort?'short':'item';let img=document.createElement('img');img.src=thumb(v);img.alt='';let s=document.createElement('span');s.textContent=title(v);b.append(img,s);b.onclick=()=>isShort?openShort(id(v)):play(i);root.append(b)})}document.getElementById('sound').onclick=()=>{if(!ready)return;unmuted=!unmuted;unmuted?player.unMute():player.mute();document.getElementById('sound').textContent=unmuted?'🔊 ミュート':'🔇 音を出す'};function openShort(videoId){const f=document.createElement('iframe');f.src='https://www.youtube.com/embed/'+encodeURIComponent(videoId)+'?autoplay=1&playsinline=1';f.allow='autoplay; encrypted-media; picture-in-picture';document.getElementById('shortFrame').replaceChildren(f);document.getElementById('modal').classList.add('open');if(ready)player.pauseVideo()}function closeShort(){document.getElementById('modal').classList.remove('open');document.getElementById('shortFrame').replaceChildren();if(ready)player.playVideo()}document.getElementById('close').onclick=closeShort;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeShort()};async function start(){try{let r=await fetch('videos.json?t='+Date.now());if(!r.ok)throw Error('videos.jsonがありません');let d=await r.json();let all=Array.isArray(d)?d:d.videos||d.items||[];normal=d.normal||d.normalVideos||all.filter(v=>!v.isShort&&!v.is_short);shorts=d.shorts||d.shortVideos||all.filter(v=>v.isShort||v.is_short);normal=normal.filter(id);shorts=shorts.filter(id);render('list',normal,false);render('shorts',shorts,true);if(normal.length){choose(0);if(window.YT?.Player)onYouTubeIframeAPIReady();else{let s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.append(s)}}else document.getElementById('currentTitle').textContent='通常動画がありません'}catch(e){document.getElementById('list').textContent='取得エラー: '+e.message;document.getElementById('shorts').textContent='取得待ち'}}start();
</script></body></html>
