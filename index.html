<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>プリンワールド｜神宮寺匁トロロ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial,'Noto Sans JP',sans-serif}.page{max-width:1700px;margin:auto;padding:14px}.content{display:grid;grid-template-columns:minmax(0,1fr)320px;gap:14px;align-items:start}.main{min-width:0}.video-wrapper{aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden}#player{width:100%;height:100%}.video-info{padding:12px 2px}.video-title{font-size:18px;font-weight:700}.video-channel,.status{font-size:12px;color:#aaa;margin-top:7px}.error{color:#ff8888}.recommend-title{font-weight:700;margin-bottom:10px}.video-list{display:flex;flex-direction:column;gap:10px;max-height:720px;overflow:auto}.video-item{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px;padding:5px;border:0;border-radius:7px;background:transparent;color:white;text-align:left;cursor:pointer}.video-item.active{background:#303030}.thumbnail{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:5px}.item-title{font-size:12px;line-height:1.4;overflow-wrap:anywhere}.manga{margin-top:18px;background:#fff;color:#111;border-radius:8px;overflow:hidden}.manga-main-title{background:#111;color:#fff;font-size:25px;font-weight:800;padding:16px}.manga-round-selector{background:#111;padding:12px;border-top:1px solid #333}.manga-round-select{width:100%;padding:12px;background:#222;color:#fff;border:1px solid #555;border-radius:7px;font-size:15px}.manga-episode-title{background:#111;color:#fff;padding:13px;font-size:15px;font-weight:700}.manga-page{display:block;width:100%;height:auto}.missing{padding:20px;color:#555;background:#eee;font-size:13px}@media(max-width:700px){.page{padding:5px}.content{grid-template-columns:minmax(0,1fr)135px;gap:7px}.video-title{font-size:13px}.video-list{max-height:450px}.video-item{display:block;padding:2px}.item-title{font-size:10px}.recommend-title{font-size:12px}.manga-main-title{font-size:20px;padding:10px}.manga-episode-title{font-size:11px;padding:10px}}@media(max-width:420px){.content{grid-template-columns:minmax(0,1fr)120px;gap:5px}.item-title{font-size:9px}}
</style></head><body><div class="page"><div class="content"><main class="main"><div class="video-wrapper"><div id="player"></div></div><div class="video-info"><div id="currentTitle" class="video-title">動画を読み込んでいます…</div><div id="currentChannel" class="video-channel">音声なしで自動再生を試みます。音声はプレーヤーでオンにできます。</div><div id="status" class="status"></div></div><section class="manga"><div class="manga-main-title">プリンワールド</div><div class="manga-round-selector"><select id="mangaRoundSelect" class="manga-round-select" aria-label="漫画の周目を選択"></select></div><div id="mangaPages"></div></section></main><aside><div class="recommend-title">おすすめ</div><div id="videoList" class="video-list"><div class="status">動画を読み込んでいます…</div></div></aside></div></div>
<script>
'use strict';
const videos=[];let currentIndex=0,player=null,playerReady=false;
const validId=id=>typeof id==='string'&&/^[A-Za-z0-9_-]{11}$/.test(id);
const status=(msg,error=false)=>{const e=document.getElementById('status');e.textContent=msg;e.className='status'+(error?' error':'')};
const titles={1:'第一話「プリンを食べて寝たら、異世界に召喚された」',2:'第二話「プリンの女神とヨーグルトの女神～なぜか国同士が喧嘩してました～」',3:'第三話「異世界の勇者に選ばれた俺、プリン博士の研究所へ行くことになりました」',4:'第四話「召喚した猫、まさかの伝説級！？〜あくびで研究所が吹き飛んだ〜」'};
const selector=document.getElementById('mangaRoundSelect');for(let n=1;n<=20;n++){const option=document.createElement('option');option.value=String(n);option.textContent=n+'周目';selector.append(option)}
function changeMangaRound(round){const n=Number(round);if(!Number.isInteger(n)||n<1||n>20)return;const root=document.getElementById('mangaPages');root.replaceChildren();for(let i=1;i<=4;i++){const episode=(n-1)*4+i;const title=titles[episode]||'第'+episode+'話';const heading=document.createElement('div');heading.className='manga-episode-title';heading.textContent=title;const img=document.createElement('img');img.className='manga-page';img.src='pudding_episode'+String(episode).padStart(2,'0')+'.png';img.alt=title;img.loading=episode===1?'eager':'lazy';img.onerror=()=>{img.style.display='none';const notice=document.createElement('div');notice.className='missing';notice.textContent='第'+episode+'話の画像がまだアップロードされていません。';img.after(notice)};root.append(heading,img)}}
selector.addEventListener('change',()=>changeMangaRound(selector.value));changeMangaRound(1);
function updateInfo(){const v=videos[currentIndex];if(!v)return;document.getElementById('currentTitle').textContent=v.title||'動画';document.querySelectorAll('.video-item').forEach((el,i)=>{el.classList.toggle('active',i===currentIndex);el.setAttribute('aria-pressed',String(i===currentIndex))})}
function selectVideo(index){if(index<0||index>=videos.length)return;currentIndex=index;updateInfo();if(playerReady){player.loadVideoById(videos[index].id);player.mute();player.playVideo()}else status('プレーヤーを準備しています…')}
function nextVideo(){if(!videos.length)return;selectVideo((currentIndex+1)%videos.length)}
window.onYouTubeIframeAPIReady=()=>{if(!videos.length)return;player=new YT.Player('player',{width:'100%',height:'100%',videoId:videos[0].id,playerVars:{autoplay:1,mute:1,playsinline:1,controls:1,rel:0,origin:location.origin},events:{onReady(event){playerReady=true;event.target.mute();event.target.playVideo();status('ミュート自動再生中。再生されない場合は再生ボタンを押してください。')},onStateChange(event){if(event.data===YT.PlayerState.ENDED)nextVideo()},onError(event){const code=event.data;status('この動画を再生できません（エラー '+code+'）。次の動画を試します。',true);if([2,5,100,101,150,153].includes(code)&&videos.length>1){setTimeout(nextVideo,1200)}}}})};
function renderList(){const list=document.getElementById('videoList');list.replaceChildren();videos.forEach((v,i)=>{const btn=document.createElement('button');btn.type='button';btn.className='video-item';const img=document.createElement('img');img.className='thumbnail';img.src='https://i.ytimg.com/vi/'+v.id+'/mqdefault.jpg';img.alt='';img.loading='lazy';const label=document.createElement('span');label.className='item-title';label.textContent=v.title||'動画';btn.append(img,label);btn.addEventListener('click',()=>selectVideo(i));list.append(btn)});updateInfo()}
async function loadVideos(){try{const response=await fetch('./videos.json',{cache:'no-store'});if(!response.ok)throw Error('videos.jsonが見つかりません');const data=await response.json();if(!Array.isArray(data))throw Error('動画一覧の形式が正しくありません');for(const item of data){const id=item?.id||item?.contentDetails?.videoId||item?.snippet?.resourceId?.videoId;if(validId(id))videos.push({id,title:item.title||item.snippet?.title||'動画'})}if(!videos.length)throw Error('再生できる動画IDがありません');renderList();const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';script.onerror=()=>status('YouTubeプレーヤーを読み込めません',true);document.head.append(script)}catch(error){status('動画一覧の読み込みに失敗: '+error.message,true);document.getElementById('videoList').textContent='動画一覧を取得できませんでした。'}}
loadVideos();
</script></body></html>
