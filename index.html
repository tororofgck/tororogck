<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>神宮寺匁トロロ｜動画＋漫画</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:white;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:1000;background:rgba(17,17,17,.96);padding:12px;text-align:center;font-size:20px;font-weight:bold;border-bottom:1px solid #333}.container{width:100%;max-width:1000px;margin:auto;padding:12px}.youtube-section{position:sticky;top:53px;z-index:900;background:#111;padding-bottom:10px}.youtube{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}#player,#player iframe{width:100%!important;height:100%!important;border:0}.status{margin-top:8px;padding:9px 11px;background:#1d1d1d;border-radius:7px;color:#aaa;font-size:13px;line-height:1.5}.error{color:#ff7777}.recommend-title{margin-top:14px;font-size:18px;font-weight:bold}.video-list{display:flex;gap:10px;overflow-x:auto;padding:10px 0}.video-card{flex:0 0 180px;background:#202020;border-radius:8px;overflow:hidden;cursor:pointer;border:1px solid #333;color:white;text-align:left;padding:0;font:inherit}.video-card:hover{background:#292929}.video-card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.video-title{padding:8px;font-size:12px;line-height:1.4}.manga-title{margin-top:25px;margin-bottom:10px;font-size:22px;font-weight:bold}.manga{width:100%;background:#000;text-align:center}.manga-page{display:block;width:100%;max-width:900px;height:auto;margin:0 auto;user-select:none;-webkit-user-drag:none}.controls{display:flex;justify-content:center;align-items:center;gap:12px;padding:15px 0}.controls button{border:0;border-radius:8px;padding:11px 18px;background:#292929;color:white;font-size:15px}#pageNumber{min-width:70px;text-align:center;color:#aaa}@media(max-width:600px){header{font-size:17px}.youtube-section{top:46px}.video-card{flex-basis:155px}}
</style></head><body><header>📺 神宮寺匁トロロ × 📖 オリジナル漫画</header><div class="container"><section class="youtube-section"><div class="youtube"><div id="player"></div></div><div id="playerStatus" class="status">YouTubeプレーヤーを準備しています……</div><div class="recommend-title">📺 神宮寺匁トロロ おすすめ動画</div><div id="videoList" class="video-list"><div class="status">動画を読み込み中……</div></div></section><section><div class="manga-title">📖 オリジナル漫画</div><div class="manga"><img id="mangaPage" class="manga-page" src="manga/001.jpg" alt="漫画ページ"></div><div class="controls"><button onclick="previousPage()">← 前へ</button><span id="pageNumber">1 / 10</span><button onclick="nextPage()">次へ →</button></div></section></div>
<script>
let player=null,playerReady=false,pendingVideoId=null;
function setPlayerStatus(message,isError=false){const e=document.getElementById('playerStatus');e.textContent=message;e.className='status'+(isError?' error':'')}
window.onYouTubeIframeAPIReady=function(){const vars={playsinline:1,rel:0,enablejsapi:1};if(location.protocol==='https:'||location.protocol==='http:')vars.origin=location.origin;player=new YT.Player('player',{width:'100%',height:'100%',playerVars:vars,events:{onReady(){playerReady=true;setPlayerStatus('動画を選択すると再生できます。');if(pendingVideoId){const id=pendingVideoId;pendingVideoId=null;playVideo(id)}},onError(e){const messages={2:'動画IDが正しくありません。',5:'HTML5プレーヤーで再生できません。',100:'動画が存在しないか、非公開です。',101:'この動画は埋め込み再生が許可されていません。',150:'この動画は埋め込み再生が許可されていません。',153:'Error 153：HTTP Refererを確認できません。HTTPSサイトから開いてください。'};setPlayerStatus(messages[e.data]||'YouTubeプレーヤーエラー：'+e.data,true)}}})};
function playVideo(id){if(!/^[A-Za-z0-9_-]{11}$/.test(id))return;if(!playerReady){pendingVideoId=id;setPlayerStatus('プレーヤーを準備しています……');return}setPlayerStatus('動画を読み込んでいます……');player.loadVideoById(id)}
async function loadVideos(){const list=document.getElementById('videoList');try{const response=await fetch('./videos.json',{cache:'no-store'});if(!response.ok)throw Error('動画一覧ファイルがまだ生成されていません。');const videos=await response.json();if(!Array.isArray(videos)||!videos.length)throw Error('公開動画が見つかりません。');list.replaceChildren();for(const item of videos){if(!item||!/^[A-Za-z0-9_-]{11}$/.test(item.id))continue;const card=document.createElement('button');card.type='button';card.className='video-card';const img=document.createElement('img');img.src='https://i.ytimg.com/vi/'+item.id+'/mqdefault.jpg';img.alt=String(item.title||'動画');img.loading='lazy';const title=document.createElement('div');title.className='video-title';title.textContent=String(item.title||'動画');card.append(img,title);card.addEventListener('click',()=>playVideo(item.id));list.appendChild(card)}if(!list.children.length)throw Error('表示可能な動画がありません。');}catch(err){list.replaceChildren();const box=document.createElement('div');box.className='status error';box.textContent='動画を取得できませんでした。 '+err.message;list.appendChild(box)}}
const TOTAL_PAGES=10;let currentPage=1;function showPage(){document.getElementById('mangaPage').src='manga/'+String(currentPage).padStart(3,'0')+'.jpg';document.getElementById('pageNumber').textContent=currentPage+' / '+TOTAL_PAGES}function nextPage(){if(currentPage<TOTAL_PAGES){currentPage++;showPage()}}function previousPage(){if(currentPage>1){currentPage--;showPage()}}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nextPage();if(e.key==='ArrowLeft')previousPage()});let touchStartX=0;const mangaImage=document.getElementById('mangaPage');mangaImage.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX},{passive:true});mangaImage.addEventListener('touchend',e=>{const delta=e.changedTouches[0].clientX-touchStartX;if(delta< -50)nextPage();if(delta>50)previousPage()},{passive:true});showPage();const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';script.onerror=()=>setPlayerStatus('YouTube APIを読み込めませんでした。',true);document.head.appendChild(script);loadVideos();
</script></body></html>
