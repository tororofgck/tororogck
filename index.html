<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プリンワールド</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  background: #0f0f0f;
  color: #fff;
  font-family: Arial, "Noto Sans JP", sans-serif;
}

body {
  overflow-x: hidden;
}

.page {
  width: 100%;
  max-width: 1700px;
  margin: 0 auto;
  padding: 20px;
}

/* =========================================
   動画 + おすすめ
========================================= */

.content {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 420px;
  gap: 20px;
  align-items: start;
}

.main {
  min-width: 0;
}

.video-wrapper {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border-radius: 10px;
  overflow: hidden;
}

#player {
  width: 100%;
  height: 100%;
}

/* =========================================
   動画情報
========================================= */

.video-info {
  padding: 14px 2px;
}

.video-title {
  font-size: 20px;
  font-weight: 700;
  line-height: 1.4;
}

.video-channel {
  margin-top: 7px;
  color: #aaa;
  font-size: 13px;
}

/* =========================================
   おすすめ
========================================= */

.recommend-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 12px;
}

.video-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.video-item {
  display: grid;
  grid-template-columns: 175px minmax(0, 1fr);
  gap: 10px;
  padding: 4px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s;
}

.video-item:hover {
  background: #272727;
}

.video-item.active {
  background: #333;
}

.thumbnail {
  width: 175px;
  aspect-ratio: 16 / 9;
  background: #222;
  border-radius: 7px;
  overflow: hidden;
}

.thumbnail img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.item-info {
  min-width: 0;
}

.item-title {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;

  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
}

.item-channel {
  margin-top: 6px;
  color: #aaa;
  font-size: 12px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.loading,
.error {
  color: #aaa;
  font-size: 13px;
  padding: 10px 0;
}

/* =========================================
   プリンワールド 漫画
========================================= */

.manga {
  width: 100%;
  margin-top: 25px;
  background: #fff;
  color: #111;
  border-radius: 10px;
  overflow: hidden;
}

.manga-header {
  background: #111;
  color: #fff;
  padding: 18px 20px;
}

.manga-title {
  font-size: 28px;
  font-weight: 800;
}

.manga-episode {
  margin-top: 5px;
  color: #aaa;
  font-size: 14px;
  line-height: 1.5;
}

.manga-pages {
  width: 100%;
}

.manga-page {
  display: block;
  width: 100%;
  height: auto;
}

/* =========================================
   タブレット
========================================= */

@media (max-width: 1100px) {

  .page {
    padding: 14px;
  }

  .content {
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 14px;
  }

  .video-item {
    grid-template-columns: 130px minmax(0, 1fr);
  }

  .thumbnail {
    width: 130px;
  }

  .item-title {
    font-size: 12px;
  }

  .item-channel {
    font-size: 10px;
  }
}

/* =========================================
   スマホ
========================================= */

@media (max-width: 700px) {

  .page {
    padding: 5px;
  }

  /*
    スマホでも
    動画：左
    おすすめ：右
  */

  .content {
    grid-template-columns: minmax(0, 1fr) 135px;
    gap: 7px;
  }

  .video-wrapper {
    border-radius: 6px;
  }

  .video-title {
    font-size: 14px;
  }

  .video-channel {
    font-size: 10px;
  }

  .recommend-title {
    font-size: 12px;
    margin-bottom: 7px;
  }

  .video-list {
    gap: 8px;
  }

  .video-item {
    display: block;
    padding: 0;
  }

  .video-item:hover {
    background: transparent;
  }

  .thumbnail {
    width: 100%;
    border-radius: 5px;
  }

  .item-title {
    margin-top: 3px;
    font-size: 10px;
    line-height: 1.3;
  }

  .item-channel {
    margin-top: 2px;
    font-size: 8px;
  }

  .manga {
    margin-top: 10px;
    border-radius: 5px;
  }

  .manga-header {
    padding: 10px 12px;
  }

  .manga-title {
    font-size: 20px;
  }

  .manga-episode {
    font-size: 10px;
    line-height: 1.5;
  }
}

/* =========================================
   小型スマホ
========================================= */

@media (max-width: 420px) {

  .content {
    grid-template-columns: minmax(0, 1fr) 120px;
    gap: 5px;
  }

  .item-title {
    font-size: 9px;
  }

  .item-channel {
    font-size: 7px;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="content">

    <!-- =====================================
         メイン
    ====================================== -->

    <main class="main">

      <div class="video-wrapper">
        <div id="player"></div>
      </div>

      <div class="video-info">

        <div id="currentTitle" class="video-title">
          動画を読み込んでいます…
        </div>

        <div id="currentChannel" class="video-channel">
        </div>

      </div>


      <!-- =====================================
           プリンワールド 漫画
      ====================================== -->

      <section class="manga">

        <!-- =====================================
             第一話
        ====================================== -->

        <div class="manga-header">

          <div class="manga-title">
            プリンワールド
          </div>

          <div class="manga-episode">
            第一話「プリンを食べて寝たら、異世界に召喚された」
          </div>

        </div>

        <div class="manga-pages">

          <img
            class="manga-page"
            src="PSX_20260906_190250.png"
            alt="プリンワールド 第一話">

        </div>


        <!-- =====================================
             第二話
        ====================================== -->

        <div class="manga-header">

          <div class="manga-title">
            プリンワールド
          </div>

          <div class="manga-episode">
            第二話「プリンの女神とヨーグルトの女神～なぜか国同士が喧嘩してました～」
          </div>

        </div>

        <div class="manga-pages">

          <img
            class="manga-page"
            src="pudding_episode02.png"
            alt="プリンワールド 第二話">

        </div>

      </section>

    </main>


    <!-- =====================================
         おすすめ
    ====================================== -->

    <aside>

      <div class="recommend-title">
        おすすめ
      </div>

      <div id="videoList" class="video-list">

        <div class="loading">
          動画を読み込んでいます…
        </div>

      </div>

    </aside>

  </div>

</div>


<script>

/* =========================================
   設定
========================================= */

const API_KEY =
  "AIzaSyAffHbfRoiwRy1_Kz7reVyQsNr0UPJinvQ";

const CHANNEL_ID =
  "UCsvwCi51I9pFl3fVf18pWEQ";

const API_BASE =
  "https://www.googleapis.com/youtube/v3";


/* =========================================
   状態
========================================= */

let player = null;

let videos = [];

let currentIndex = 0;


/* =========================================
   YouTube IFrame API
========================================= */

function loadYouTubeAPI() {

  return new Promise((resolve, reject) => {

    if (
      window.YT &&
      window.YT.Player
    ) {
      resolve();
      return;
    }

    window.onYouTubeIframeAPIReady =
      function () {
        resolve();
      };

    const script =
      document.createElement("script");

    script.src =
      "https://www.youtube.com/iframe_api";

    script.onerror =
      function () {

        reject(
          new Error(
            "YouTube IFrame APIの読み込みに失敗しました"
          )
        );

      };

    document.head.appendChild(script);

  });

}


/* =========================================
   プレイヤー作成
========================================= */

function createPlayer(videoId) {

  player =
    new YT.Player(
      "player",
      {

        width: "100%",

        height: "100%",

        videoId: videoId,

        playerVars: {

          autoplay: 1,

          playsinline: 1,

          controls: 1,

          rel: 0

        },

        events: {

          onReady: function (event) {

            event.target.mute();

            event.target.playVideo();

          },


          onStateChange:
            function (event) {

              if (
                event.data ===
                YT.PlayerState.ENDED
              ) {

                playNextVideo();

              }

            }

        }

      }
    );

}


/* =========================================
   次の動画
========================================= */

function playNextVideo() {

  if (!videos.length) {
    return;
  }

  currentIndex++;

  if (
    currentIndex >= videos.length
  ) {

    currentIndex = 0;

  }

  const nextVideo =
    videos[currentIndex];

  const nextVideoId =
    nextVideo
      .contentDetails
      .videoId;

  updateActiveItem();

  updateVideoInfo(
    nextVideo
  );

  player.loadVideoById({
    videoId: nextVideoId,
    startSeconds: 0
  });

  player.mute();

  player.playVideo();

}


/* =========================================
   手動でおすすめをクリック
========================================= */

function playVideo(index) {

  if (
    index < 0 ||
    index >= videos.length
  ) {
    return;
  }

  currentIndex = index;

  const video =
    videos[currentIndex];

  const videoId =
    video
      .contentDetails
      .videoId;

  updateActiveItem();

  updateVideoInfo(video);

  player.loadVideoById({
    videoId: videoId,
    startSeconds: 0
  });

  player.mute();

  player.playVideo();

}


/* =========================================
   おすすめの選択状態
========================================= */

function updateActiveItem() {

  const items =
    document.querySelectorAll(
      ".video-item"
    );

  items.forEach(
    (item, index) => {

      if (
        index === currentIndex
      ) {

        item.classList.add("active");

      }
      else {

        item.classList.remove("active");

      }

    }
  );

}


/* =========================================
   動画情報
========================================= */

function updateVideoInfo(video) {

  if (!video) {
    return;
  }

  document.getElementById(
    "currentTitle"
  ).textContent =
    video.snippet.title;

  document.getElementById(
    "currentChannel"
  ).textContent =
    video.snippet.channelTitle;

}


/* =========================================
   おすすめ欄生成
========================================= */

function renderVideoList() {

  const list =
    document.getElementById(
      "videoList"
    );

  list.innerHTML = "";

  videos.forEach(
    (video, index) => {

      const snippet =
        video.snippet;

      const videoId =
        video.contentDetails.videoId;

      const thumbnail =
        snippet.thumbnails?.medium?.url ||
        snippet.thumbnails?.high?.url ||
        snippet.thumbnails?.default?.url;

      const item =
        document.createElement("div");

      item.className =
        "video-item";

      item.innerHTML = `

        <div class="thumbnail">

          <img
            src="${thumbnail}"
            alt=""
            loading="lazy">

        </div>

        <div class="item-info">

          <div class="item-title">
            ${escapeHTML(
              snippet.title
            )}
          </div>

          <div class="item-channel">
            ${escapeHTML(
              snippet.channelTitle
            )}
          </div>

        </div>

      `;

      item.addEventListener(
        "click",
        function () {

          playVideo(index);

        }
      );

      list.appendChild(item);

    }
  );

  updateActiveItem();

}


/* =========================================
   YouTube Data API
========================================= */

async function loadVideos() {

  const list =
    document.getElementById(
      "videoList"
    );

  try {

    /*
      チャンネル情報
    */

    const channelURL =
      API_BASE +
      "/channels" +
      "?part=contentDetails" +
      "&id=" +
      encodeURIComponent(
        CHANNEL_ID
      ) +
      "&key=" +
      encodeURIComponent(
        API_KEY
      );

    const channelResponse =
      await fetch(channelURL);

    if (!channelResponse.ok) {

      throw new Error(
        "チャンネル情報の取得に失敗しました"
      );

    }

    const channelData =
      await channelResponse.json();

    if (
      !channelData.items ||
      channelData.items.length === 0
    ) {

      throw new Error(
        "チャンネルが見つかりません"
      );

    }

    const uploadsPlaylist =
      channelData
        .items[0]
        .contentDetails
        .relatedPlaylists
        .uploads;

    /*
      アップロード動画一覧
    */

    const playlistURL =
      API_BASE +
      "/playlistItems" +
      "?part=snippet,contentDetails" +
      "&playlistId=" +
      encodeURIComponent(
        uploadsPlaylist
      ) +
      "&maxResults=20" +
      "&key=" +
      encodeURIComponent(
        API_KEY
      );

    const playlistResponse =
      await fetch(playlistURL);

    if (!playlistResponse.ok) {

      throw new Error(
        "動画一覧の取得に失敗しました"
      );

    }

    const playlistData =
      await playlistResponse.json();

    videos =
      playlistData.items || [];

    if (!videos.length) {

      throw new Error(
        "動画がありません"
      );

    }

    /*
      おすすめ欄を作る
    */

    renderVideoList();

    /*
      1番上からスタート
    */

    currentIndex = 0;

    const firstVideo =
      videos[0];

    updateVideoInfo(
      firstVideo
    );

    /*
      YouTube IFrame APIを読み込む
    */

    await loadYouTubeAPI();

    /*
      1番上を自動再生
    */

    createPlayer(
      firstVideo
        .contentDetails
        .videoId
    );

  }
  catch (error) {

    console.error(error);

    list.innerHTML = `
      <div class="error">
        YouTube動画を取得できませんでした。
        <br><br>
        ${escapeHTML(
          error.message
        )}
      </div>
    `;

  }

}


/* =========================================
   HTMLエスケープ
========================================= */

function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text || "";

  return div.innerHTML;

}


/* =========================================
   開始
========================================= */

loadVideos();

</script>

</body>
</html>
