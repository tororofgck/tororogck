<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プリンワールド</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  background: #0f0f0f;
  color: #fff;
  font-family: Arial, "Noto Sans JP", sans-serif;
}

body {
  overflow-x: hidden;
}

.page {
  width: 100%;
  max-width: 1700px;
  margin: 0 auto;
  padding: 20px;
}

/* =========================================
   動画 + おすすめ
========================================= */

.content {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 420px;
  gap: 20px;
  align-items: start;
}

.main {
  min-width: 0;
}

.video-wrapper {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border-radius: 10px;
  overflow: hidden;
}

#player {
  width: 100%;
  height: 100%;
}

/* =========================================
   動画情報
========================================= */

.video-info {
  padding: 14px 2px;
}

.video-title {
  font-size: 20px;
  font-weight: 700;
  line-height: 1.4;
}

.video-channel {
  margin-top: 7px;
  color: #aaa;
  font-size: 13px;
}

/* =========================================
   おすすめ
========================================= */

.recommend-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 12px;
}

.video-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.video-item {
  display: grid;
  grid-template-columns: 175px minmax(0, 1fr);
  gap: 10px;
  padding: 4px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s;
}

.video-item:hover {
  background: #272727;
}

.video-item.active {
  background: #333;
}

.thumbnail {
  width: 175px;
  aspect-ratio: 16 / 9;
  background: #222;
  border-radius: 7px;
  overflow: hidden;
}

.thumbnail img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.item-info {
  min-width: 0;
}

.item-title {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;

  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
}

.item-channel {
  margin-top: 6px;
  color: #aaa;
  font-size: 12px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.loading,
.error {
  color: #aaa;
  font-size: 13px;
  padding: 10px 0;
}

/* =========================================
   プリンワールド
========================================= */

.manga {
  width: 100%;
  margin-top: 25px;
  background: #fff;
  color: #111;
  border-radius: 10px;
  overflow: hidden;
}

/* =========================================
   作品タイトル
========================================= */

.manga-main-title {
  background: #111;
  color: #fff;
  padding: 18px 20px;
}

.manga-title {
  font-size: 28px;
  font-weight: 800;
}

/* =========================================
   周目プルダウン
========================================= */

.manga-round-selector {
  background: #111;
  padding: 12px 20px;
  border-top: 1px solid #333;
  border-bottom: 1px solid #333;
}

.manga-round-select {
  width: 100%;
  padding: 12px 42px 12px 14px;

  background: #222;
  color: #fff;

  border: 1px solid #555;
  border-radius: 8px;

  font-size: 15px;
  font-weight: 700;

  cursor: pointer;

  appearance: auto;
  -webkit-appearance: auto;
}

.manga-round-select:focus {
  outline: 2px solid #fff;
  outline-offset: 1px;
}

/* =========================================
   漫画
   タイトル → 画像 → タイトル → 画像
========================================= */

.manga-pages {
  width: 100%;
  background: #fff;
}

.manga-episode-title {
  width: 100%;
  background: #111;
  color: #fff;
  padding: 14px 20px;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.5;
}

.manga-page {
  display: block;
  width: 100%;
  height: auto;
}

/* =========================================
   タブレット
========================================= */

@media (max-width: 1100px) {

  .page {
    padding: 14px;
  }

  .content {
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 14px;
  }

  .video-item {
    grid-template-columns: 130px minmax(0, 1fr);
  }

  .thumbnail {
    width: 130px;
  }

  .item-title {
    font-size: 12px;
  }

  .item-channel {
    font-size: 10px;
  }

  .manga-episode-title {
    font-size: 14px;
  }
}

/* =========================================
   スマホ
========================================= */

@media (max-width: 700px) {

  .page {
    padding: 5px;
  }

  .content {
    grid-template-columns: minmax(0, 1fr) 135px;
    gap: 7px;
  }

  .video-wrapper {
    border-radius: 6px;
  }

  .video-title {
    font-size: 14px;
  }

  .video-channel {
    font-size: 10px;
  }

  .recommend-title {
    font-size: 12px;
    margin-bottom: 7px;
  }

  .video-list {
    gap: 8px;
  }

  .video-item {
    display: block;
    padding: 0;
  }

  .video-item:hover {
    background: transparent;
  }

  .thumbnail {
    width: 100%;
    border-radius: 5px;
  }

  .item-title {
    margin-top: 3px;
    font-size: 10px;
    line-height: 1.3;
  }

  .item-channel {
    margin-top: 2px;
    font-size: 8px;
  }

  .manga {
    margin-top: 10px;
    border-radius: 5px;
  }

  .manga-main-title {
    padding: 10px 12px;
  }

  .manga-title {
    font-size: 20px;
  }

  .manga-round-selector {
    padding: 8px 10px;
  }

  .manga-round-select {
    padding: 10px 12px;
    font-size: 13px;
    border-radius: 6px;
  }

  .manga-episode-title {
    padding: 10px 12px;
    font-size: 11px;
    line-height: 1.5;
  }
}

/* =========================================
   小型スマホ
========================================= */

@media (max-width: 420px) {

  .content {
    grid-template-columns: minmax(0, 1fr) 120px;
    gap: 5px;
  }

  .item-title {
    font-size: 9px;
  }

  .item-channel {
    font-size: 7px;
  }

  .manga-title {
    font-size: 18px;
  }

  .manga-round-select {
    font-size: 12px;
  }

  .manga-episode-title {
    font-size: 10px;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="content">

    <!-- =====================================
         メイン
    ====================================== -->

    <main class="main">

      <div class="video-wrapper">
        <div id="player"></div>
      </div>

      <div class="video-info">

        <div id="currentTitle" class="video-title">
          動画を読み込んでいます…
        </div>

        <div id="currentChannel" class="video-channel">
        </div>

      </div>


      <!-- =====================================
           プリンワールド
      ====================================== -->

      <section class="manga">

        <!-- 作品タイトル -->

        <div class="manga-main-title">

          <div class="manga-title">
            プリンワールド
          </div>

        </div>


        <!-- =====================================
             周目選択
        ====================================== -->

        <div class="manga-round-selector">

          <select
            id="mangaRoundSelect"
            class="manga-round-select"
            onchange="changeMangaRound(this.value)"
          >

            <option value="1">1周目</option>
            <option value="2">2周目</option>
            <option value="3">3周目</option>
            <option value="4">4周目</option>
            <option value="5">5周目</option>
            <option value="6">6周目</option>
            <option value="7">7周目</option>
            <option value="8">8周目</option>
            <option value="9">9周目</option>
            <option value="10">10周目</option>
            <option value="11">11周目</option>
            <option value="12">12周目</option>
            <option value="13">13周目</option>
            <option value="14">14周目</option>
            <option value="15">15周目</option>
            <option value="16">16周目</option>
            <option value="17">17周目</option>
            <option value="18">18周目</option>
            <option value="19">19周目</option>
            <option value="20">20周目</option>

          </select>

        </div>


        <!-- =====================================
             漫画表示
        ====================================== -->

        <div
          id="mangaPages"
          class="manga-pages"
        ></div>

      </section>

    </main>


    <!-- =====================================
         おすすめ
    ====================================== -->

    <aside>

      <div class="recommend-title">
        おすすめ
      </div>

      <div
        id="videoList"
        class="video-list"
      >

        <div class="loading">
          動画を読み込んでいます…
        </div>

      </div>

    </aside>

  </div>

</div>


<script>

/* =========================================
   YouTube設定
========================================= */

const API_KEY =
  "AIzaSyAffHbfRoiwRy1_Kz7reVyQsNr0UPJinvQ";

const CHANNEL_ID =
  "UCsvwCi51I9pFl3fVf18pWEQ";

const API_BASE =
  "https://www.googleapis.com/youtube/v3";


/* =========================================
   状態
========================================= */

let player = null;

let videos = [];

let currentIndex = 0;


/* =========================================
   漫画設定
========================================= */

/*
  1周 = 4話

  1周目
  第1話 → 1.png
  第2話 → 2.png
  第3話 → 3.png
  第4話 → pudding_episode04.png

  2周目
  第5話 → 5.png
  第6話 → 6.png
  第7話 → 7.png
  第8話 → 8.png

  3周目
  第9話  → 9.png
  第10話 → 10.png
  第11話 → 11.png
  第12話 → 12.png

  ...

  20周目
  第77話 → 77.png
  第78話 → 78.png
  第79話 → 79.png
  第80話 → 80.png
*/

const MANGA_IMAGES_PER_ROUND = 4;


/* =========================================
   話数タイトル
========================================= */

const MANGA_EPISODES = {

  1:
    '第一話「プリンを食べて寝たら、異世界に召喚された」',

  2:
    '第二話「プリンの女神とヨーグルトの女神～なぜか国同士が喧嘩してました～」',

  3:
    '第三話「異世界の勇者に選ばれた俺、プリン博士の研究所へ行くことになりました」',

  4:
    '第四話「召喚した猫、まさかの伝説級！？〜あくびで研究所が吹き飛んだ〜」'

};


/* =========================================
   話数タイトル取得
========================================= */

function getEpisodeTitle(episodeNumber) {

  if (
    MANGA_EPISODES[episodeNumber]
  ) {

    return MANGA_EPISODES[episodeNumber];

  }


  return "第" +
    episodeNumber +
    "話";

}


/* =========================================
   漫画 周目変更
========================================= */

function changeMangaRound(round) {

  round =
    parseInt(
      round,
      10
    );


  if (
    isNaN(round) ||
    round < 1 ||
    round > 20
  ) {

    return;

  }


  const pages =
    document.getElementById(
      "mangaPages"
    );


  /*
    一度クリア
  */

  pages.innerHTML = "";


  /*
    その周目の最初の話数

    1周目 → 第1話
    2周目 → 第5話
    3周目 → 第9話
    ...
    20周目 → 第77話
  */

  const startEpisode =
    (
      (round - 1) *
      MANGA_IMAGES_PER_ROUND
    ) + 1;


  /*
    4話分を

    タイトル
    ↓
    画像
    ↓
    タイトル
    ↓
    画像

    の順番で表示
  */

  for (
    let i = 0;
    i < MANGA_IMAGES_PER_ROUND;
    i++
  ) {

    const episodeNumber =
      startEpisode + i;


    /*
      ================================
      タイトル
      ================================
    */

    const title =
      document.createElement(
        "div"
      );


    title.className =
      "manga-episode-title";


    title.textContent =
      getEpisodeTitle(
        episodeNumber
      );


    pages.appendChild(
      title
    );


    /*
      ================================
      画像
      ================================
    */

    const img =
      document.createElement(
        "img"
      );


    img.className =
      "manga-page";


    /*
      第4話だけ専用画像
    */

    if (
      episodeNumber === 4
    ) {

      img.src =
        "pudding_episode04.png";

    }
    else {

      img.src =
        episodeNumber +
        ".png";

    }


    img.alt =
      getEpisodeTitle(
        episodeNumber
      );


    img.loading =
      "lazy";


    pages.appendChild(
      img
    );

  }

}


/* =========================================
   初期表示
========================================= */

changeMangaRound(1);


/* =========================================
   YouTube IFrame API
========================================= */

function loadYouTubeAPI() {

  return new Promise(
    (resolve, reject) => {

      if (
        window.YT &&
        window.YT.Player
      ) {

        resolve();

        return;

      }


      window.onYouTubeIframeAPIReady =
        function () {

          resolve();

        };


      const script =
        document.createElement(
          "script"
        );


      script.src =
        "https://www.youtube.com/iframe_api";


      script.onerror =
        function () {

          reject(
            new Error(
              "YouTube IFrame APIの読み込みに失敗しました"
            )
          );

        };


      document.head.appendChild(
        script
      );

    }
  );

}


/* =========================================
   プレイヤー作成
========================================= */

function createPlayer(videoId) {

  player =
    new YT.Player(
      "player",
      {

        width:
          "100%",

        height:
          "100%",

        videoId:
          videoId,

        playerVars: {

          autoplay:
            1,

          playsinline:
            1,

          controls:
            1,

          rel:
            0,

          origin:
            "https://tororofgck.github.io"

        },

        host:
          "https://www.youtube.com",

        events: {

          onReady:
            function (event) {

              event.target.mute();

              event.target.playVideo();

            },


          onStateChange:
            function (event) {

              if (
                event.data ===
                YT.PlayerState.ENDED
              ) {

                playNextVideo();

              }

            }

        }

      }
    );

}


/* =========================================
   次の動画
========================================= */

function playNextVideo() {

  if (
    !videos.length
  ) {

    return;

  }


  currentIndex++;


  if (
    currentIndex >=
    videos.length
  ) {

    currentIndex = 0;

  }


  const nextVideo =
    videos[currentIndex];


  const nextVideoId =
    nextVideo
      .contentDetails
      .videoId;


  updateActiveItem();


  updateVideoInfo(
    nextVideo
  );


  player.loadVideoById({

    videoId:
      nextVideoId,

    startSeconds:
      0

  });


  player.mute();

  player.playVideo();

}


/* =========================================
   手動でおすすめをクリック
========================================= */

function playVideo(index) {

  if (
    index < 0 ||
    index >= videos.length
  ) {

    return;

  }


  currentIndex =
    index;


  const video =
    videos[currentIndex];


  const videoId =
    video
      .contentDetails
      .videoId;


  updateActiveItem();


  updateVideoInfo(
    video
  );


  player.loadVideoById({

    videoId:
      videoId,

    startSeconds:
      0

  });


  player.mute();

  player.playVideo();

}


/* =========================================
   おすすめの選択状態
========================================= */

function updateActiveItem() {

  const items =
    document.querySelectorAll(
      ".video-item"
    );


  items.forEach(
    (item, index) => {

      if (
        index ===
        currentIndex
      ) {

        item.classList.add(
          "active"
        );

      }
      else {

        item.classList.remove(
          "active"
        );

      }

    }
  );

}


/* =========================================
   動画情報
========================================= */

function updateVideoInfo(video) {

  if (!video) {

    return;

  }


  document.getElementById(
    "currentTitle"
  ).textContent =
    video.snippet.title;


  document.getElementById(
    "currentChannel"
  ).textContent =
    video.snippet.channelTitle;

}


/* =========================================
   おすすめ欄生成
========================================= */

function renderVideoList() {

  const list =
    document.getElementById(
      "videoList"
    );


  list.innerHTML = "";


  videos.forEach(
    (video, index) => {

      const snippet =
        video.snippet;


      const thumbnail =
        snippet
          .thumbnails
          ?.medium
          ?.url ||
        snippet
          .thumbnails
          ?.high
          ?.url ||
        snippet
          .thumbnails
          ?.default
          ?.url;


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "video-item";


      item.innerHTML = `

        <div class="thumbnail">

          <img
            src="${thumbnail}"
            alt=""
            loading="lazy">

        </div>

        <div class="item-info">

          <div class="item-title">
            ${escapeHTML(
              snippet.title
            )}
          </div>

          <div class="item-channel">
            ${escapeHTML(
              snippet.channelTitle
            )}
          </div>

        </div>

      `;


      item.addEventListener(
        "click",
        function () {

          playVideo(index);

        }
      );


      list.appendChild(
        item
      );

    }
  );


  updateActiveItem();

}


/* =========================================
   YouTube Data API
========================================= */

async function loadVideos() {

  const list =
    document.getElementById(
      "videoList"
    );


  try {

    const channelURL =
      API_BASE +
      "/channels" +
      "?part=contentDetails" +
      "&id=" +
      encodeURIComponent(
        CHANNEL_ID
      ) +
      "&key=" +
      encodeURIComponent(
        API_KEY
      );


    const channelResponse =
      await fetch(
        channelURL
      );


    if (
      !channelResponse.ok
    ) {

      throw new Error(
        "チャンネル情報の取得に失敗しました"
      );

    }


    const channelData =
      await channelResponse.json();


    if (
      !channelData.items ||
      channelData.items.length === 0
    ) {

      throw new Error(
        "チャンネルが見つかりません"
      );

    }


    const uploadsPlaylist =
      channelData
        .items[0]
        .contentDetails
        .relatedPlaylists
        .uploads;


    const playlistURL =
      API_BASE +
      "/playlistItems" +
      "?part=snippet,contentDetails" +
      "&playlistId=" +
      encodeURIComponent(
        uploadsPlaylist
      ) +
      "&maxResults=20" +
      "&key=" +
      encodeURIComponent(
        API_KEY
      );


    const playlistResponse =
      await fetch(
        playlistURL
      );


    if (
      !playlistResponse.ok
    ) {

      throw new Error(
        "動画一覧の取得に失敗しました"
      );

    }


    const playlistData =
      await playlistResponse.json();


    videos =
      playlistData.items ||
      [];


    if (
      !videos.length
    ) {

      throw new Error(
        "動画がありません"
      );

    }


    renderVideoList();


    currentIndex =
      0;


    const firstVideo =
      videos[0];


    updateVideoInfo(
      firstVideo
    );


    await loadYouTubeAPI();


    createPlayer(
      firstVideo
        .contentDetails
        .videoId
    );

  }
  catch (error) {

    console.error(
      error
    );


    list.innerHTML = `

      <div class="error">

        YouTube動画を取得できませんでした。

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =========================================
   HTMLエスケープ
========================================= */

function escapeHTML(text) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text || "";


  return div.innerHTML;

}


/* =========================================
   開始
========================================= */

loadVideos();

</script>

</body>
</html>
