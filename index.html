<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GhostError</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#0f0f0f;
  color:#fff;
  font-family:Arial,"Noto Sans JP",sans-serif;
}

.page{
  width:100%;
  max-width:1700px;
  margin:auto;
  padding:20px;
}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 420px;
  gap:20px;
}

.main{
  min-width:0;
}

.video{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  border-radius:10px;
  overflow:hidden;
}

#player{
  width:100%;
  height:100%;
}

/* 漫画 */

.manga{
  margin-top:20px;
  background:#fff;
  color:#111;
  border-radius:10px;
  overflow:hidden;
}

.manga-header{
  padding:18px 20px;
  background:#111;
  color:#fff;
}

.manga-title{
  font-size:28px;
  font-weight:800;
}

.manga-episode{
  margin-top:5px;
  color:#aaa;
  font-size:14px;
}

.manga-page{
  display:block;
  width:100%;
  height:auto;
}

/* おすすめ */

.list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.item{
  display:grid;
  grid-template-columns:175px minmax(0,1fr);
  gap:10px;
  padding:3px;
  border-radius:8px;
  cursor:pointer;
}

.item:hover{
  background:#272727;
}

.thumb{
  width:175px;
  aspect-ratio:16/9;
  background:#222;
  overflow:hidden;
  border-radius:7px;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.info{
  min-width:0;
}

.title{
  font-size:14px;
  line-height:1.4;
  font-weight:600;

  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
  overflow:hidden;
}

.channel{
  margin-top:6px;
  color:#aaa;
  font-size:12px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.loading,
.error{
  padding:10px;
  color:#aaa;
  font-size:13px;
}

/* タブレット */

@media(max-width:1100px){

  .page{
    padding:14px;
  }

  .layout{
    grid-template-columns:minmax(0,1fr) 320px;
    gap:14px;
  }

  .item{
    grid-template-columns:130px minmax(0,1fr);
  }

  .thumb{
    width:130px;
  }

  .title{
    font-size:12px;
  }

  .channel{
    font-size:10px;
  }
}

/* スマホ */

@media(max-width:700px){

  .page{
    padding:5px;
  }

  .layout{
    grid-template-columns:minmax(0,1fr) 135px;
    gap:7px;
  }

  .video{
    border-radius:6px;
  }

  .item{
    display:block;
    padding:0;
  }

  .thumb{
    width:100%;
    aspect-ratio:16/9;
    border-radius:5px;
  }

  .info{
    padding-top:3px;
  }

  .title{
    font-size:10px;
    line-height:1.3;
  }

  .channel{
    font-size:8px;
    margin-top:2px;
  }

  .manga{
    margin-top:8px;
    border-radius:5px;
  }

  .manga-header{
    padding:10px 12px;
  }

  .manga-title{
    font-size:20px;
  }

  .manga-episode{
    font-size:10px;
  }
}

@media(max-width:420px){

  .layout{
    grid-template-columns:minmax(0,1fr) 120px;
    gap:5px;
  }

  .title{
    font-size:9px;
  }

  .channel{
    font-size:7px;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="layout">

    <!-- 左：動画＋漫画 -->

    <main class="main">

      <div class="video">
        <div id="player"></div>
      </div>

      <section class="manga">

        <div class="manga-header">

          <div class="manga-title">
            GhostError
          </div>

          <div class="manga-episode">
            第1話
          </div>

        </div>

        <img
          class="manga-page"
          src="manga01.jpg"
          alt="GhostError 第1話">

        <img
          class="manga-page"
          src="manga02.jpg"
          alt="GhostError 第1話">

        <img
          class="manga-page"
          src="manga03.jpg"
          alt="GhostError 第1話">

        <img
          class="manga-page"
          src="manga04.jpg"
          alt="GhostError 第1話">

      </section>

    </main>


    <!-- 右：おすすめ -->

    <aside>

      <div id="videoList" class="list">

        <div class="loading">
          動画を読み込んでいます…
        </div>

      </div>

    </aside>

  </div>

</div>


<script>

/* ==========================================
   設定
========================================== */

const API_KEY =
  "AIzaSyAffHbfRoiwRy1_Kz7reVyQsNr0UPJinvQ";

const CHANNEL_ID =
  "UCsvwCi51I9pFl3fVf18pWEQ";

const API_BASE =
  "https://www.googleapis.com/youtube/v3";

let youtubePlayer = null;


/* ==========================================
   YouTube IFrame API
========================================== */

function loadYouTubeAPI(){

  return new Promise((resolve,reject)=>{

    if(
      window.YT &&
      window.YT.Player
    ){

      resolve();
      return;
    }

    window.onYouTubeIframeAPIReady =
      function(){

        resolve();

      };

    const script =
      document.createElement("script");

    script.src =
      "https://www.youtube.com/iframe_api";

    script.onerror =
      function(){

        reject(
          new Error(
            "YouTube IFrame APIの読み込みに失敗"
          )
        );

      };

    document.head.appendChild(script);

  });

}


/* ==========================================
   プレイヤー作成
========================================== */

function createPlayer(videoId){

  youtubePlayer =
    new YT.Player(
      "player",
      {

        width:"100%",
        height:"100%",

        videoId:videoId,

        playerVars:{
          autoplay:1,
          playsinline:1,
          controls:1,
          rel:0
        },

        events:{

          onReady:function(event){

            /*
             * 自動再生用。
             * まずミュートして再生。
             *
             * 今回はブラウザの
             * 自動再生制限を避けるため
             * ミュート固定。
             */

            event.target.mute();

            event.target.playVideo();

          }

        }

      }
    );

}


/* ==========================================
   おすすめから動画変更
========================================== */

function playVideo(videoId){

  if(!youtubePlayer){

    createPlayer(videoId);

    return;
  }

  youtubePlayer.loadVideoById({
    videoId:videoId,
    startSeconds:0
  });

  youtubePlayer.mute();
  youtubePlayer.playVideo();

}


/* ==========================================
   YouTube APIから動画取得
========================================== */

async function init(){

  const list =
    document.getElementById(
      "videoList"
    );

  try{

    /* チャンネル情報 */

    const channelURL =
      API_BASE +
      "/channels" +
      "?part=contentDetails" +
      "&id=" +
      CHANNEL_ID +
      "&key=" +
      API_KEY;


    const channelResponse =
      await fetch(channelURL);


    if(!channelResponse.ok){

      throw new Error(
        "チャンネル情報取得失敗"
      );

    }


    const channelData =
      await channelResponse.json();


    if(
      !channelData.items ||
      channelData.items.length === 0
    ){

      throw new Error(
        "チャンネルが見つかりません"
      );

    }


    const uploadsPlaylist =
      channelData
        .items[0]
        .contentDetails
        .relatedPlaylists
        .uploads;


    /* 動画一覧 */

    const playlistURL =
      API_BASE +
      "/playlistItems" +
      "?part=snippet,contentDetails" +
      "&playlistId=" +
      uploadsPlaylist +
      "&maxResults=20" +
      "&key=" +
      API_KEY;


    const playlistResponse =
      await fetch(playlistURL);


    if(!playlistResponse.ok){

      throw new Error(
        "動画一覧取得失敗"
      );

    }


    const playlistData =
      await playlistResponse.json();


    const videos =
      playlistData.items || [];


    /* ======================================
       最新動画を自動再生
    ====================================== */

    if(videos.length){

      const firstVideoId =
        videos[0]
          .contentDetails
          .videoId;


      await loadYouTubeAPI();

      createPlayer(
        firstVideoId
      );

    }


    /* ======================================
       おすすめ欄
    ====================================== */

    list.innerHTML = "";


    videos.forEach(
      function(video){

        const videoId =
          video
            .contentDetails
            .videoId;


        if(!videoId){
          return;
        }


        const snippet =
          video.snippet;


        const title =
          escapeHTML(
            snippet.title
          );


        const channel =
          escapeHTML(
            snippet.channelTitle
          );


        const thumbnail =
          snippet
            .thumbnails
            ?.medium
            ?.url ||
          snippet
            .thumbnails
            ?.high
            ?.url ||
          snippet
            .thumbnails
            ?.default
            ?.url;


        const item =
          document.createElement(
            "div"
          );


        item.className =
          "item";


        item.innerHTML = `

          <div class="thumb">

            <img
              src="${thumbnail}"
              alt=""
              loading="lazy">

          </div>

          <div class="info">

            <div class="title">
              ${title}
            </div>

            <div class="channel">
              ${channel}
            </div>

          </div>

        `;


        item.addEventListener(
          "click",
          function(){

            playVideo(
              videoId
            );

          }
        );


        list.appendChild(item);

      }
    );


  }catch(error){

    console.error(error);


    list.innerHTML = `
      <div class="error">
        YouTube動画を取得できませんでした。
        <br>
        APIキーまたはYouTube Data APIの設定を確認してください。
      </div>
    `;

  }

}


/* ==========================================
   HTMLエスケープ
========================================== */

function escapeHTML(text){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text || "";

  return div.innerHTML;

}


/* ==========================================
   起動
========================================== */

init();

</script>

</body>
</html>
