<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>GhostError</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
  background:#0f0f0f;
  color:#fff;
  font-family:Arial,"Noto Sans JP",sans-serif;
}

body{
  overflow-x:hidden;
}

.page{
  width:100%;
  max-width:1700px;
  margin:0 auto;
  padding:20px;
}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 420px;
  gap:20px;
  align-items:start;
}

/* =================================
   左側
================================= */

.main{
  min-width:0;
}

/* =================================
   YouTube動画
================================= */

.video{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  border-radius:10px;
  overflow:hidden;
}

.video iframe{
  width:100%;
  height:100%;
  display:block;
  border:0;
}

/* =================================
   漫画
================================= */

.manga{
  width:100%;
  margin-top:20px;
  background:#fff;
  border-radius:10px;
  overflow:hidden;
}

.manga-header{
  background:#111;
  padding:18px 20px;
  border-bottom:1px solid #333;
}

.manga-title{
  font-size:28px;
  font-weight:800;
  letter-spacing:.5px;
}

.manga-episode{
  margin-top:5px;
  color:#aaa;
  font-size:14px;
}

.manga-pages{
  width:100%;
  display:flex;
  flex-direction:column;
}

.manga-page{
  width:100%;
  height:auto;
  display:block;
}

/* =================================
   右側おすすめ
================================= */

.recommend{
  min-width:0;
}

.list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.item{
  display:grid;
  grid-template-columns:175px minmax(0,1fr);
  gap:10px;
  width:100%;
  cursor:pointer;
  border-radius:8px;
  padding:3px;
}

.item:hover{
  background:#272727;
}

.thumb{
  width:175px;
  aspect-ratio:16/9;
  position:relative;
  overflow:hidden;
  border-radius:7px;
  background:#222;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.info{
  min-width:0;
}

.title{
  font-size:14px;
  line-height:1.4;
  font-weight:600;

  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
  overflow:hidden;
}

.channel{
  color:#aaa;
  font-size:12px;
  margin-top:6px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.loading{
  color:#aaa;
  font-size:13px;
  padding:10px 0;
}

.error{
  color:#aaa;
  font-size:13px;
  line-height:1.6;
}

/* =================================
   タブレット
================================= */

@media(max-width:1100px){

  .page{
    padding:14px;
  }

  .layout{
    grid-template-columns:minmax(0,1fr) 320px;
    gap:14px;
  }

  .item{
    grid-template-columns:130px minmax(0,1fr);
  }

  .thumb{
    width:130px;
  }

  .title{
    font-size:12px;
  }

  .channel{
    font-size:10px;
  }

}

/* =================================
   スマホ
   動画：左
   おすすめ：右
================================= */

@media(max-width:700px){

  .page{
    padding:5px;
  }

  .layout{
    grid-template-columns:minmax(0,1fr) 135px;
    gap:7px;
  }

  .video{
    border-radius:6px;
  }

  .manga{
    margin-top:8px;
    border-radius:5px;
  }

  .manga-header{
    padding:10px 12px;
  }

  .manga-title{
    font-size:20px;
  }

  .manga-episode{
    font-size:10px;
    margin-top:3px;
  }

  .list{
    gap:8px;
  }

  .item{
    display:block;
    padding:0;
  }

  .item:hover{
    background:none;
  }

  .thumb{
    width:100%;
    aspect-ratio:16/9;
    border-radius:5px;
  }

  .info{
    padding-top:3px;
  }

  .title{
    font-size:10px;
    line-height:1.3;
  }

  .channel{
    font-size:8px;
    margin-top:2px;
  }

}

/* =================================
   小型スマホ
================================= */

@media(max-width:420px){

  .page{
    padding:4px;
  }

  .layout{
    grid-template-columns:minmax(0,1fr) 120px;
    gap:5px;
  }

  .manga-title{
    font-size:18px;
  }

  .title{
    font-size:9px;
  }

  .channel{
    font-size:7px;
  }

}
</style>
</head>

<body>

<div class="page">

  <div class="layout">

    <!-- =================================
         左：YouTube動画＋漫画
    ================================== -->

    <main class="main">

      <div class="video">

        <iframe
          id="player"
          src=""
          title="YouTube video player"
          allow="autoplay; encrypted-media; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>

      </div>


      <!-- =================================
           GhostError
      ================================== -->

      <section class="manga">

        <div class="manga-header">

          <div class="manga-title">
            GhostError
          </div>

          <div class="manga-episode">
            第1話
          </div>

        </div>

        <div class="manga-pages">

          <img
            class="manga-page"
            src="manga01.jpg"
            alt="GhostError 第1話 1ページ目"
            loading="lazy">

          <img
            class="manga-page"
            src="manga02.jpg"
            alt="GhostError 第1話 2ページ目"
            loading="lazy">

          <img
            class="manga-page"
            src="manga03.jpg"
            alt="GhostError 第1話 3ページ目"
            loading="lazy">

          <img
            class="manga-page"
            src="manga04.jpg"
            alt="GhostError 第1話 4ページ目"
            loading="lazy">

        </div>

      </section>

    </main>


    <!-- =================================
         右：おすすめ
    ================================== -->

    <aside class="recommend">

      <div id="videoList" class="list">

        <div class="loading">
          動画を読み込んでいます…
        </div>

      </div>

    </aside>

  </div>

</div>


<script>

/* ==========================================
   YouTube Data API
========================================== */

const API_KEY =
  "AIzaSyAffHbfRoiwRy1_Kz7reVyQsNr0UPJinvQ";

const CHANNEL_ID =
  "UCsvwCi51I9pFl3fVf18pWEQ";

const API_BASE =
  "https://www.googleapis.com/youtube/v3";


/* ==========================================
   初期化
========================================== */

async function init(){

  const list =
    document.getElementById("videoList");

  try{

    /*
      チャンネル情報取得
    */

    const channelURL =
      `${API_BASE}/channels` +
      `?part=contentDetails,snippet` +
      `&id=${CHANNEL_ID}` +
      `&key=${API_KEY}`;

    const channelResponse =
      await fetch(channelURL);

    if(!channelResponse.ok){

      throw new Error(
        "チャンネル情報取得失敗"
      );

    }

    const channelData =
      await channelResponse.json();

    if(
      !channelData.items ||
      !channelData.items.length
    ){

      throw new Error(
        "チャンネルが見つかりません"
      );

    }

    const uploadsPlaylist =
      channelData
      .items[0]
      .contentDetails
      .relatedPlaylists
      .uploads;


    /*
      動画一覧取得
    */

    const playlistURL =
      `${API_BASE}/playlistItems` +
      `?part=snippet,contentDetails` +
      `&playlistId=${uploadsPlaylist}` +
      `&maxResults=20` +
      `&key=${API_KEY}`;

    const playlistResponse =
      await fetch(playlistURL);

    if(!playlistResponse.ok){

      throw new Error(
        "動画一覧取得失敗"
      );

    }

    const playlistData =
      await playlistResponse.json();

    const videos =
      playlistData.items || [];


    /*
      最初の動画を自動再生
      ※ mute=1 は一切使用しない
    */

    if(videos.length){

      setMainVideo(
        videos[0]
        .contentDetails
        .videoId
      );

    }


    /*
      おすすめ動画作成
    */

    list.innerHTML = "";


    videos.forEach(video=>{

      const snippet =
        video.snippet;

      const videoId =
        video.contentDetails.videoId;

      if(!videoId) return;

      const title =
        escapeHTML(snippet.title);

      const channelTitle =
        escapeHTML(snippet.channelTitle);

      const thumbnail =
        snippet.thumbnails?.medium?.url ||
        snippet.thumbnails?.high?.url ||
        snippet.thumbnails?.default?.url;


      const item =
        document.createElement("div");

      item.className =
        "item";


      item.innerHTML = `

        <div class="thumb">

          <img
            src="${thumbnail}"
            alt=""
            loading="lazy">

        </div>

        <div class="info">

          <div class="title">
            ${title}
          </div>

          <div class="channel">
            ${channelTitle}
          </div>

        </div>

      `;


      /*
        おすすめ動画をクリック
      */

      item.addEventListener(
        "click",
        ()=>{

          setMainVideo(videoId);

          window.scrollTo({
            top:0,
            behavior:"smooth"
          });

        }
      );


      list.appendChild(item);

    });


    if(!videos.length){

      list.innerHTML = `
        <div class="error">
          動画がありません。
        </div>
      `;

    }

  }catch(error){

    console.error(error);

    list.innerHTML = `
      <div class="error">
        YouTube動画を取得できませんでした。<br>
        APIキーまたはAPI設定を確認してください。
      </div>
    `;

  }

}


/* ==========================================
   メイン動画
   音声あり自動再生を要求
========================================== */

function setMainVideo(videoId){

  const player =
    document.getElementById("player");

  /*
    重要：
    mute=1 は入れていない。

    autoplay=1 → 自動再生
    playsinline=1 → スマホでもページ内再生
    rel=0 → 関連動画を同チャンネル中心にする
  */

  player.src =
    `https://www.youtube.com/embed/${videoId}` +
    `?autoplay=1` +
    `&playsinline=1` +
    `&rel=0`;

}


/* ==========================================
   HTMLエスケープ
========================================== */

function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent =
    text || "";

  return div.innerHTML;

}


/* ==========================================
   START
========================================== */

init();

</script>

</body>
</html>
